name: Build and Deploy Nexa Bot

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-bot:latest

  deploy:
    runs-on: self-hosted
    needs: build

    env:
      DEPLOY_DIR: /home/nexa
      ENV_FILE: /home/envs/nexa.env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ENV file
        run: |
          if [ ! -f ${{ env.ENV_FILE }} ]; then
            echo "❌ Missing nexa.env at ${{ env.ENV_FILE }}"
            exit 1
          fi
          echo "✅ ENV file verified"

      - name: Prepare deploy directory
        run: |
          mkdir -p ${{ env.DEPLOY_DIR }}
          cp docker-compose.yml ${{ env.DEPLOY_DIR }}/docker-compose.yml

      - name: Pull latest Docker image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nexa-bot:latest

      - name: Deploy with Docker Compose
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Create a .env file that docker-compose can reference
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

          docker compose down --remove-orphans || true
          docker compose up -d
          echo "🚀 Nexa Bot deployed successfully"

      - name: Verify deployment
        run: |
          sleep 5
          docker ps | grep -E "Nexa|nexa-redis"
          docker logs --tail 20 Nexa

      - name: On failure — fetch logs
        if: failure()
        run: |
          echo "❌ Deployment failed — fetching logs..."
          docker logs Nexa || true