name: Build and Deploy Nexa Bot

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-bot:latest

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Pull and restart containers
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nexa-bot:latest

          docker stop Nexa || true
          docker rm Nexa || true

          docker stop nexa-redis || true
          docker rm nexa-redis || true

          docker network create nexa-network || true

          docker run -d \
            --name nexa-redis \
            --network nexa-network \
            --restart unless-stopped \
            redis:7-alpine \
            redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

          sleep 3

          docker run -d \
            --name Nexa \
            --network nexa-network \
            -e REDIS_HOST="nexa-redis" \
            -e REDIS_PORT="6379" \
            --env-file /home/envs/nexa.env \
            -v /home/nexa/logs:/app/logs \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/nexa-bot:latest

          sleep 5
          docker ps | grep -E "Nexa|nexa-redis"
          docker exec nexa-redis redis-cli ping

      - name: Verify deployment
        run: |
          docker logs --tail 20 Nexa

      - name: On failure — fetch logs
        if: failure()
        run: |
          echo "❌ Deployment failed — fetching logs..."
          docker logs Nexa || true